<!doctype html><meta charset="utf-8"><title>Cash cent precision</title><div id="root"></div>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { CashRegisterModals } from '/src/modules/CashRegisterModals.jsx';
import { NotificationBell } from '/src/components/NotificationBell.jsx';
import { TenantContext } from '/src/features/branches/context/TenantContext.js';
import { projectFinancialNotice, projectLogicalCashExpiry } from '/src/features/notifications/infrastructure/notificationQueryRepository.js';
const root = createRoot(document.getElementById('root'));
const checks = [], calls = [];
const check = (ok, label) => { if (!ok) throw Error(label); checks.push(label); };
const tick = () => new Promise(resolve => setTimeout(resolve, 25));
const wait = async test => { for (let i = 0; i < 100; i++) { if (test()) return; await tick(); } throw Error('React render timed out'); };
const props = { setShowOpenModal: () => {}, setShowCloseModal: () => {}, isLoadingSession: false,
  openRegister: async amount => { calls.push(['open', amount]); return false; },
  calculateClose: async amount => { calls.push(['close', amount]); return null; },
  confirmClose: async () => { throw Error('No financial close should run in this test'); } };
let result;
try {
  for (const mode of ['open', 'close']) {
    root.render(React.createElement(CashRegisterModals, { ...props, showOpenModal: mode === 'open', showCloseModal: mode === 'close' }));
    await wait(() => document.querySelector('input[type="number"]') && document.querySelector('h2')?.textContent.includes(mode === 'open' ? 'Abrir caja' : '¿Cuánto'));
    let input = document.querySelector('input[type="number"]');
    check(input.step === '0.01' && input.min === '0', `${mode}: native validation allows cents and bars negatives`);
    const enter = async text => {
      input = document.querySelector('input[type="number"]');
      Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set.call(input, text);
      input.dispatchEvent(new Event('input', { bubbles: true }));
      await tick();
    };
    const submit = async () => {
      document.querySelector('form').dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
      await tick();
      await wait(() => !document.querySelector('fieldset').disabled);
    };
    for (const text of ['0', '0.01', '10.05', '50000.01', '1000000000.00']) {
      await enter(text); check(input.checkValidity(), `${mode}: ${text} has no visual step mismatch`);
      const count = calls.length; await submit();
      check(calls.length === count + 1 && calls.at(-1)[0] === mode && calls.at(-1)[1] === Number(text), `${mode}: ${text} reaches only the intended callback unchanged`);
    }
    for (const text of ['-0.01', '10.051', '10.050', '0.001', '1e-2', '1e309', 'NaN', 'Infinity', '', '1000000000.01']) {
      await enter(text); const count = calls.length; await submit();
      check(calls.length === count, `${mode}: rejects ${text || '(empty)'} without rounding or calling a repository`);
    }
    await enter('10.05');
    check(input.value === '10.05', `${mode}: a rejected attempt keeps the form editable`);
  }
  let resolveOpening, attempts = 0, dismissals = 0;
  const opening = new Promise(resolve => { resolveOpening = resolve; });
  const openingId = 'p23-cash-amount-opening';
  const renderOpening = currentSession => root.render(React.createElement(CashRegisterModals, { ...props, currentSession, openingId,
    showOpenModal: true, showCloseModal: false, setShowOpenModal: open => { if (!open) dismissals++; },
    openRegister: amount => { check(amount === 100, 'opening sends the declared amount'); attempts++; return opening; } }));
  renderOpening(null);
  await wait(() => document.querySelector('h2')?.textContent.includes('Abrir caja'));
  const fund = document.querySelector('input[type="number"]');
  Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set.call(fund, '100.00');
  fund.dispatchEvent(new Event('input', { bubbles: true }));
  await tick();
  const form = document.querySelector('form');
  for (let click = 0; click < 2; click++) form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
  await wait(() => document.querySelector('fieldset').disabled);
  check(attempts === 1 && dismissals === 0, 'a double submit sends one opening and the busy modal remains visible');
  renderOpening({ id: openingId, status: 'open', serverConfirmed: false, sparkLockVerified: true });
  await wait(() => document.body.innerText.includes('Ya hay un turno'));
  check(dismissals === 0 && document.querySelector('[role="dialog"]'), 'a cached shift never closes the dialog');
  resolveOpening(false);
  await wait(() => !document.querySelector('fieldset').disabled);
  renderOpening({ id: 'unrelated-opening', status: 'open', serverConfirmed: true, sparkLockVerified: true });
  await tick();
  check(dismissals === 0 && document.querySelector('[role="dialog"]'), 'A different confirmed shift never acknowledges this opening');
  renderOpening({ id: openingId, status: 'open', serverConfirmed: true, sparkLockVerified: true });
  await wait(() => dismissals === 1 && !document.querySelector('[role="dialog"]'));
  check(attempts === 1, 'confirmed shift closes the dialog without another opening');
  let verifyRecovery, recoveryAttempts = 0, recoveryDismissals = 0;
  const old = { id: 'previous', status: 'open', serverConfirmed: true, heldByOther: true };
  const replacementId = 'p23-cash-amount-replacement';
  const renderRecovery = currentSession => root.render(React.createElement(CashRegisterModals, { ...props,
    key: 'recover:' + old.id, currentSession, recoverySession: old, openingId: replacementId, showOpenModal: true, showCloseModal: false,
    setShowOpenModal: open => { if (!open) recoveryDismissals++; },
    openRegister: (...command) => {
      check(JSON.stringify(command) === '[50]', 'ordinary opening sends only the independently entered fund');
      recoveryAttempts++;
      return new Promise(resolve => { verifyRecovery = resolve; });
    },
  }));
  renderRecovery(old);
  await wait(() => document.querySelector('h2')?.textContent.includes('Abrir caja'));
  const replacementFund = document.querySelector('input[type="number"]');
  check(replacementFund.value === '' && document.body.innerText.includes('sin arqueo'), 'recovery requires a fresh fund and explains the prior state');
  Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set.call(replacementFund, '50');
  replacementFund.dispatchEvent(new Event('input', { bubbles: true }));
  await tick();
  const recoverForm = document.querySelector('form');
  for (let click = 0; click < 2; click++) recoverForm.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
  await wait(() => document.querySelector('fieldset').disabled);
  check(recoveryAttempts === 1 && recoveryDismissals === 0, 'only one recovery submits, with the modal locked during the transaction');
  verifyRecovery(false);
  await wait(() => document.body.innerText.includes('aún no se confirmó'));
  check(replacementFund.value === '50' && recoveryDismissals === 0, 'an uncertain result preserves the input without claiming recovery');
  renderRecovery({ id: replacementId, status: 'open', serverConfirmed: true, sparkLockVerified: true });
  await wait(() => recoveryDismissals === 1 && !document.querySelector('[role="dialog"]'));
  check(recoveryAttempts === 1, 'server-confirmed replacement closes the modal without another write');
  const cases = [
    [83.30, 83.30, 0, 'El conteo coincide', 'text-success', false],
    [50, 50, 0, 'El conteo coincide', 'text-success', false],
    [50, 100, 50, 'Sobran S/ 50.00', 'text-warning', true],
    [83.30, 70, -13.30, 'Faltan S/ 13.30', 'text-danger', true],
    [83.30, 90, 6.70, 'Sobran S/ 6.70', 'text-warning', true],
    [-5, 0, 5, 'Referencia de caja por verificar', 'text-warning', true],
    [NaN, 0, null, 'Referencia de caja por verificar', 'text-warning', true],
  ];
  const closings = [];
  for (const [index, [expectedAmount, declared, difference, label, color, noteRequired]] of cases.entries()) {
    root.render(React.createElement(CashRegisterModals, { ...props, key: `p29-close-${index}`, showCloseModal: true, showOpenModal: false,
      calculateClose: async declaredAmount => ({ openingAmount: 100, posCash: 83.30, contractCash: -50, expectedAmount,
        declaredAmount, difference, hasUnverifiedDisbursements: true }),
      confirmClose: async (summary, note) => { closings.push({ summary, note }); return false; } }));
    await wait(() => document.querySelector('[role="dialog"] input[type="number"]'));
    const input = document.querySelector('[role="dialog"] input[type="number"]');
    Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set.call(input, String(declared));
    input.dispatchEvent(new Event('input', { bubbles: true }));
    await tick();
    document.querySelector('[role="dialog"] form').requestSubmit();
    await wait(() => document.querySelector('.cash-confirm-dialog'));
    const dialog = document.querySelector('.cash-confirm-dialog');
    const panel = [...dialog.querySelectorAll('dt')].find(node => node.textContent === 'Resultado del conteo').parentElement;
    const textarea = dialog.querySelector('textarea');
    check(panel.querySelector('dd').textContent === label && panel.classList.contains(color), `P29 cash color and label: ${label}`);
    check(Boolean(textarea?.required) === noteRequired && (noteRequired || !textarea), `P29 observation requirement: ${label}`);
    if (!noteRequired) {
      const reminder = 'Los ajustes contables se revisan por separado';
      check(!dialog.innerText.includes(reminder), 'P29 hides the refund-evidence note until details open');
      dialog.querySelector('details').open = true;
      check(dialog.innerText.includes(reminder), 'P29 keeps the evidence warning inside the detail');
      dialog.querySelector('form').requestSubmit();
      await wait(() => closings.length === index + 1);
      check(closings.at(-1).summary.hasUnverifiedDisbursements && closings.at(-1).note === '', 'P29 passes the unchanged evidence flag and no mandatory note to close');
    } else {
      dialog.querySelector('form').requestSubmit();
      await tick();
      check(closings.length === 2, 'P29 closure still rejects a required observation left empty');
    }
  }
  const user = { uid: 'owner', role: 'dueño', businessId: 'tenant' }, read = [];
  const createdAt = '2026-11-16T05:05:36Z', base = { businessId: 'tenant', branchId: 'branch' };
  const contract = projectFinancialNotice('contract-cancel', { ...base, id: 'order', status: 'cancelado', sparkContractVersion: 1,
    voidedAt: createdAt, voidedBy: 'cashier', cancelOperationId: 'once', contractNumber: 'PED-P29', voidReason: '<img src="fake">', total: 100 }, 'tenant', user.uid);
  const original = projectFinancialNotice('pos-void', { ...base, id: 'sale', saleId: 'sale', userId: 'cashier', authority: 'pos-compensation',
    protocol: 1, amount: -20, occurredAt: createdAt }, 'tenant', user.uid);
  const close = difference => projectFinancialNotice('cash-close', { ...base, id: `close-${difference}`, closedAt: createdAt,
    runtime: 'spark', status: 'closed', closedBy: 'cashier', userId: 'cashier', declaredAmount: 83.3 + (difference ?? 0),
    reconciliationPending: true, closeEstimate: { authority: 'client-estimate', expectedCash: 83.3, difference } }, 'tenant', user.uid);
  const expiry = projectLogicalCashExpiry({ ...base, id: 'expiry', userId: 'cashier', status: 'open', runtime: 'spark', durationHours: 14,
    openedAt: '2026-11-15T09:00:00Z' }, 'tenant', user.uid, Date.parse(createdAt));
  const alerts = [contract, original, close(-13.30), close(6.70), close(null), expiry].map(notice => ({ ...notice, actorDisplayName: 'Ana de prueba' }));
  root.render(React.createElement(TenantContext.Provider, { value: { businessBranches: [{ id: 'branch', name: 'Sede Centro' }] } },
    React.createElement(NotificationBell, { user, alerts, confirmedUnreadCount: 5, isAdmin: true, isOpen: true, onClose: () => {},
      markAsRead: id => read.push(id) })));
  await wait(() => document.querySelectorAll('[role="dialog"] article').length === 6);
  const [orderCard, saleCard, shortage, surplus, unknown, expired] = document.querySelectorAll('[role="dialog"] article');
  check(orderCard.classList.contains('border-l-danger') && saleCard.classList.contains('border-l-danger'), 'P29 cancelations have red cards');
  check(orderCard.innerText.includes('PED-P29') && orderCard.innerText.includes('Ana de prueba') && orderCard.innerText.includes('Sede Centro')
    && orderCard.querySelector('time').textContent.includes('00:05:36'), 'P29 uses the verified cancellation timestamp in Lima and shows order context');
  check(!orderCard.querySelector('img') && orderCard.innerText.includes('<img src="fake">') && !orderCard.querySelector('header dl'), 'P29 renders the reason as text and shows no inferred amount');
  check(shortage.classList.contains('border-l-danger') && shortage.innerText.includes('Falta efectivo') && shortage.querySelector('header dd').textContent === 'S/ 13.30', 'P29 shortage shows a red positive magnitude');
  check(surplus.classList.contains('border-l-warning') && surplus.querySelector('header dd').textContent === 'S/ 6.70', 'P29 surplus shows the positive amount in amber');
  check(unknown.classList.contains('border-l-warning') && !unknown.querySelector('header dl') && !unknown.innerText.includes('Falta efectivo'), 'P29 missing reference is a warning without an inferred shortage');
  check(expired.classList.contains('border-l-warning') && expired.innerText.includes('Sin arqueo'), 'P29 expiry stays amber and remains distinct from a shortage');
  [...orderCard.querySelectorAll('button')].find(button => button.textContent === 'Marcar como leída').click();
  check(read.length === 1 && read[0] === contract.id, 'P29 marks exactly the displayed cancellation ID');
  result = { ok: true, checks };
} catch (error) { result = { ok: false, checks, error: error.stack }; }
root.unmount();
await fetch('/__phase4-report', { method: 'POST', body: JSON.stringify(result) });
</script>
