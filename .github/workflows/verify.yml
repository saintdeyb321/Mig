name: Verify MigaPOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-migapos
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
      VITE_FIREBASE_API_KEY: demo-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-migapos.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-migapos
      VITE_FIREBASE_STORAGE_BUCKET: demo-migapos.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      VITE_FIREBASE_APP_ID: '1:123456789:web:emulator-only'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
      - name: Architecture, sales, reports, UI security, platform, Functions and Firebase Emulator Suite
        timeout-minutes: 12
        run: |
          if npm test > "$RUNNER_TEMP/tests.log" 2>&1; then
            tail -n 20 "$RUNNER_TEMP/tests.log"
          else
            grep -n -A 18 -B 2 -E 'not ok|Error:' "$RUNNER_TEMP/tests.log" || true
            tail -n 25 "$RUNNER_TEMP/tests.log"
            exit 1
          fi
      - name: Real IndexedDB with Chromium
        timeout-minutes: 3
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser" || { echo 'Chromium is missing from the runner'; exit 1; }
          MIGAPOS_TEST_BROWSER="$browser" npm run test:offline-db
      - name: Frontend lint and build
        run: |
          npm run lint --prefix frontend
          if npm run build --prefix frontend > "$RUNNER_TEMP/build.log" 2>&1; then
            tail -n 8 "$RUNNER_TEMP/build.log"
          else
            tail -n 60 "$RUNNER_TEMP/build.log"
            exit 1
          fi
      - run: git diff --check
